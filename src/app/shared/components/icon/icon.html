<svg
  class="icon"
  [class]="'icon icon--' + size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.aria-hidden]="label() ? null : 'true'"
  [attr.aria-label]="label()"
  [attr.role]="label() ? 'img' : null"
>
  @switch (name()) {
    @case ('arrow-right') {
      <path d="M5 12h14M13 6l6 6-6 6" />
    }
    @case ('check') {
      <path d="m5 12 4 4L19 6" />
    }
    @case ('chevron-down') {
      <path d="m6 9 6 6 6-6" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 2" />
    }
    @case ('design') {
      <path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z" />
      <path d="m14 7 3 3" />
    }
    @case ('email') {
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="m4 7 8 6 8-6" />
    }
    @case ('file') {
      <path d="M6 2h8l4 4v16H6z" />
      <path d="M14 2v5h5M9 13h6M9 17h4" />
    }
    @case ('heart') {
      <path
        d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"
      />
    }
    @case ('instagram') {
      <rect x="3" y="3" width="18" height="18" rx="5" />
      <circle cx="12" cy="12" r="4" />
      <circle cx="17.5" cy="6.5" r=".7" fill="currentColor" stroke="none" />
    }
    @case ('material') {
      <path d="m12 2 9 5-9 5-9-5 9-5Z" />
      <path d="m3 12 9 5 9-5M3 17l9 5 9-5" />
    }
    @case ('package') {
      <path d="m3 7 9 5 9-5-9-5-9 5Z" />
      <path d="m3 7v10l9 5 9-5V7M12 12v10" />
    }
    @case ('precision') {
      <circle cx="12" cy="12" r="8" />
      <circle cx="12" cy="12" r="3" />
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
    }
    @case ('send') {
      <path d="m22 2-7 20-4-9-9-4 20-7Z" />
      <path d="M22 2 11 13" />
    }
    @case ('spain') {
      <path d="M5 4h14v16H5z" />
      <path d="M5 9h14M5 15h14" />
    }
    @case ('spark') {
      <path
        d="m12 2 1.4 5.1L18 9l-4.6 1.9L12 16l-1.4-5.1L6 9l4.6-1.9L12 2ZM19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15Z"
      />
    }
    @case ('tiktok') {
      <path d="M14 4v10.5a4.5 4.5 0 1 1-4-4.47M14 4c1 2.7 2.8 4.2 5 4.5" />
    }
    @case ('upload') {
      <path d="M12 16V4M7 9l5-5 5 5M4 20h16" />
    }
  }
</svg>
