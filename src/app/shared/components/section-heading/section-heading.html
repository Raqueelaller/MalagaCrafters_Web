<header
  class="section-heading"
  [class.section-heading--center]="align() === 'center'"
  [class.section-heading--inverse]="tone() === 'inverse'"
>
  @if (eyebrow(); as eyebrowText) {
    <p class="section-heading__eyebrow">{{ eyebrowText }}</p>
  }
  <h2 class="section-heading__title" [id]="headingId()">{{ title() }}</h2>
  @if (description(); as descriptionText) {
    <p class="section-heading__description">{{ descriptionText }}</p>
  }
</header>
