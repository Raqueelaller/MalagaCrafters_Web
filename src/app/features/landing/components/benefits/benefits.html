<section id="beneficios" class="section section--white" aria-labelledby="benefits-title">
  <div class="container benefits-layout">
    <div class="benefits-intro">
      <app-section-heading
        eyebrow="Por qué MalagaCrafters"
        title="No elegimos una pieza de una estantería. La hacemos contigo."
        description="Escuchamos primero, elegimos el material después y fabricamos cuando cada detalle tiene sentido para tu idea."
        headingId="benefits-title"
      />
    </div>
    <div class="benefits" #benefitsTrack>
      @for (benefit of benefits; track benefit.title) {
        <article class="benefit">
          <app-icon [name]="benefit.icon" />
          <div>
            <h3>{{ benefit.title }}</h3>
            <p>{{ benefit.description }}</p>
          </div>
        </article>
      }
    </div>
    <div class="mobile-carousel__controls" aria-label="Controles de ventajas">
      <button type="button" aria-label="Ver ventajas anteriores" (click)="scrollCards(benefitsTrack, -1)">←</button>
      <button type="button" aria-label="Ver más ventajas" (click)="scrollCards(benefitsTrack, 1)">→</button>
    </div>
  </div>
</section>
