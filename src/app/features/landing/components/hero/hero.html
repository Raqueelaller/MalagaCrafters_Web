<section class="hero" aria-labelledby="hero-title">
  <div class="hero__inner">
    <div class="hero__content">
      <p class="hero__eyebrow"><span></span> Diseño, corte y grabado láser</p>
      <h1 id="hero-title">Tu idea, convertida en una pieza <em>única</em></h1>
      <p class="hero__lead">
        Creamos proyectos personalizados en madera, metacrilato, vidrio, aluminio y cuero. Desde una
        sola unidad y con envíos a toda España.
      </p>
      <div class="hero__actions">
        <app-button href="#trabajos" variant="ghost">Ver trabajos reales</app-button>
        <app-button class="hero__mobile-contact" href="#contacto" icon="arrow-right">
          Contáctanos
        </app-button>
      </div>
      <ul class="hero__trust" aria-label="Información destacada">
        <li><app-icon name="check" size="small" /> Cada proyecto es diferente</li>
        <li><app-icon name="spain" size="small" /> Envíos a toda España</li>
      </ul>
    </div>
    <figure class="hero__visual">
      <div class="hero__frame">
        <img
          src="/images/logo.png"
          width="1024"
          height="1024"
          alt="Logotipo de MalagaCrafters con una máquina de grabado láser"
          fetchpriority="high"
        />
      </div>
    </figure>
  </div>
</section>
